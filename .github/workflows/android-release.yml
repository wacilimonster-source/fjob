name: android-release

# Unverified: requires repository secrets and a signed release keystore.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Resolve
        working-directory: apps/mobile
        run: flutter pub get
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/upload.jks"
          cat > apps/mobile/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/signing/upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build signed AAB and APK
        working-directory: apps/mobile
        run: |
          flutter build appbundle --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="${GITHUB_RUN_NUMBER}"
          flutter build apk --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="${GITHUB_RUN_NUMBER}"
      - name: Checksums
        working-directory: apps/mobile
        run: |
          sha256sum build/app/outputs/bundle/release/app-release.aab \
                    build/app/outputs/flutter-apk/app-release.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/SHA256SUMS
      - name: Clean signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing" apps/mobile/android/key.properties
