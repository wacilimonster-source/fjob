name: ci

# Action versions are pinned by tag for the handoff; pin commit SHAs before the
# first release build (documented in docs/07-implementation-notes.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  domain:
    name: finance_core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Resolve
        working-directory: packages/finance_core
        run: dart pub get
      - name: Fixture and regression tests
        working-directory: packages/finance_core
        run: dart test

  lan_transfer:
    name: LAN transfer protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Resolve
        working-directory: packages/lan_transfer
        run: dart pub get
      - name: Analyze
        working-directory: packages/lan_transfer
        run: dart analyze
      - name: Encrypted loopback tests
        working-directory: packages/lan_transfer
        run: dart test


  flutter:
    name: app analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Resolve
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Tests
        working-directory: apps/mobile
        run: flutter test
      - name: Contract fixture check
        run: python -m pip install -q pyyaml jsonschema openapi-spec-validator && python tools/verify_handoff.py

  android:
    name: android debug build and Kotlin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Resolve Dart packages
        working-directory: apps/mobile
        run: flutter pub get
      - name: Provide Android SDK paths
        run: |
          cat > apps/mobile/android/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          flutter.sdk=$FLUTTER_ROOT
          EOF
      - name: Widget contract parser tests
        working-directory: apps/mobile/android
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug

  gateway:
    name: market gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: services/market_gateway
        run: python -m pip install -r requirements.txt
      - name: Tests
        working-directory: services/market_gateway
        run: python -m pytest -q
