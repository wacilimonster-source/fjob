name: desktop-release

# PC 端发布通道：desktop-v* 标签触发，与手机 v* 通道互不干扰。
# 产出安装包（Inno Setup）、便携 zip 与 SHA-256 校验和，并创建 Release。
# 配置 WINDOWS_CERTIFICATE_BASE64 / WINDOWS_CERTIFICATE_PASSWORD 后自动
# 用 Authenticode 签名（含 RFC3161 时间戳），消除 SmartScreen 的未知发布者提示。
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Resolve
        working-directory: apps/desktop
        run: flutter pub get
      - name: Analyze and test
        working-directory: apps/desktop
        run: |
          flutter analyze
          flutter test
      - name: Build release
        working-directory: apps/desktop
        run: flutter build windows --release
      - name: Sign app executable (optional)
        working-directory: apps/desktop
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGN_CERT_BASE64)) {
            Write-Host "No WINDOWS_CERTIFICATE_BASE64 secret; skipping signing (SmartScreen will warn)."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "fjob-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $target = "build/windows/x64/runner/Release/todayagain_desktop.exe"
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGN_CERT_PASSWORD $target
          if ($LASTEXITCODE -ne 0) { throw "signing failed with $LASTEXITCODE" }
          & $signtool.FullName verify /pa /v $target
          if ($LASTEXITCODE -ne 0) { throw "signature verify failed with $LASTEXITCODE" }
          Remove-Item $pfx -Force
      - name: Package portable zip
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -match '^desktop-v(.+)$') { $Matches[1] } else { "0.1.0" }
          $src = "build/windows/x64/runner/Release"
          $zip = "build/fjob-desktop-$ver-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$src/*" -DestinationPath $zip
      - name: Build installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -match '^desktop-v(.+)$') { $Matches[1] } else { "0.1.0" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc "/DAppVersion=$ver" "installer\fjob_setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - name: Sign installer (optional)
        working-directory: apps/desktop
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGN_CERT_BASE64)) {
            Write-Host "No WINDOWS_CERTIFICATE_BASE64 secret; skipping signing (SmartScreen will warn)."
            exit 0
          }
          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -match '^desktop-v(.+)$') { $Matches[1] } else { "0.1.0" }
          $pfx = Join-Path $env:RUNNER_TEMP "fjob-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $target = "build/installer/FJOB-Setup-$ver.exe"
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGN_CERT_PASSWORD $target
          if ($LASTEXITCODE -ne 0) { throw "signing failed with $LASTEXITCODE" }
          & $signtool.FullName verify /pa /v $target
          if ($LASTEXITCODE -ne 0) { throw "signature verify failed with $LASTEXITCODE" }
          Remove-Item $pfx -Force
      - name: Checksums
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -match '^desktop-v(.+)$') { $Matches[1] } else { "0.1.0" }
          $files = @(
            "build/installer/FJOB-Setup-$ver.exe",
            "build/fjob-desktop-$ver-win-x64.zip"
          )
          $lines = foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "missing $file" }
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path -Leaf $file
            "$hash  $name"
          }
          $lines | Set-Content -Path "build/SHA256SUMS" -Encoding ascii
          Get-Content "build/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: |
            apps/desktop/build/installer/FJOB-Setup-*.exe
            apps/desktop/build/fjob-desktop-*-win-x64.zip
            apps/desktop/build/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^desktop-v(?<ver>.+)$') {
            Write-Host "workflow_dispatch without a desktop-v tag; artifacts only."
            exit 0
          }
          $ver = $Matches['ver']
          $installer = "apps/desktop/build/installer/FJOB-Setup-$ver.exe"
          $zip = "apps/desktop/build/fjob-desktop-$ver-win-x64.zip"
          $notes = "docs/releases/$tag.md"
          $ghArgs = @(
            "release", "create", $tag,
            $installer, $zip, "apps/desktop/build/SHA256SUMS",
            "--title", "今日又白干 PC $tag",
            "--prerelease"
          )
          if (Test-Path $notes) { $ghArgs += @("--notes-file", $notes) }
          else { $ghArgs += "--generate-notes" }
          gh @ghArgs
