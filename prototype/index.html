  &lt;form data-onboard-step=&quot;3&quot; hidden&gt;&lt;h2&gt;除了上班，&lt;br&gt;钱包还在哪几个战场？&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;有就填，没有就继续。生活的支线任务可以晚点接。&lt;/p&gt;&lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;hasStock&quot;&gt;我有A股持仓&lt;/label&gt;&lt;fieldset data-onboard-fields=&quot;hasStock&quot; hidden disabled&gt;&lt;div class=&quot;formgrid&quot;&gt;&lt;label class=&quot;full&quot;&gt;证券代码 / 名称&lt;input name=&quot;stockName&quot; maxlength=&quot;24&quot; required placeholder=&quot;例如 000001&quot;&gt;&lt;/label&gt;&lt;label&gt;持仓 / 股&lt;input name=&quot;stockQty&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;10000000&quot; step=&quot;1&quot; required&gt;&lt;/label&gt;&lt;label&gt;成本价 / 元&lt;input name=&quot;stockCost&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100000&quot; step=&quot;0.001&quot; required&gt;&lt;/label&gt;&lt;label class=&quot;full&quot;&gt;演示昨收参考价 / 元&lt;input name=&quot;stockPrev&quot; type=&quot;number&quot; min=&quot;0.001&quot; max=&quot;100000&quot; step=&quot;0.001&quot; required placeholder=&quot;原型手填，正式版自动获取&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;/fieldset&gt;&lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;hasGold&quot;&gt;我有按克持有的黄金&lt;/label&gt;&lt;fieldset data-onboard-fields=&quot;hasGold&quot; hidden disabled&gt;&lt;div class=&quot;formgrid&quot;&gt;&lt;label&gt;克重 / 克&lt;input name=&quot;goldQty&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;1000000&quot; step=&quot;0.001&quot; required&gt;&lt;/label&gt;&lt;label&gt;成本 / 元每克&lt;input name=&quot;goldCost&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100000&quot; step=&quot;0.01&quot; required&gt;&lt;/label&gt;&lt;label class=&quot;full&quot;&gt;演示昨日参考价 / 元每克&lt;input name=&quot;goldPrev&quot; type=&quot;number&quot; min=&quot;0.01&quot; max=&quot;100000&quot; step=&quot;0.01&quot; required placeholder=&quot;原型手填，正式版自动获取&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;/fi &lt;script&gt;
(()=&gt;{
 const root=document.getElementById(&#x27;fjob-prototype&#x27;);

 const defaults={salary:12000,days:21,start:&#x27;09:00&#x27;,end:&#x27;18:00&#x27;,breakStart:&#x27;12:00&#x27;,breakEnd:&#x27;13:00&#x27;,stockName:&#x27;000001 · 示例A股&#x27;,stockQty:1000,stockCost:13,stockPrev:12.4,goldQty:20,goldCost:850,goldPrev:900,housingMode:&#x27;mortgage&#x27;,rent:0,mortgage:4800,mortgagePrincipal:2800,car:1800,carPrincipal:1500};

 let origin=performance.now(),frame=0,comfortUntil=0;
 const design={animated:true,tone:&#x27;温柔地丧&#x27;};
 const motion=matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
 const number=(n,d=2)=&gt;Number(n).toLocaleString(&#x27;zh-CN&#x27;,{minimumFractionDigits:d,maximumFractionDigits:d});
 const money=(n,signed=false)=&gt;`${n&lt;0?&#x27;−&#x27;:signed?&#x27;+&#x27;:&#x27;&#x27;}¥${number(Math.abs(n))}`;
 const housingAmount=c=&gt;c.housingMode===&#x27;rent&#x27;?c.rent:c.housingMode===&#x27;mortgage&#x27;?c.mortgage:0;
 const timeValue=s=&gt;{const [h,m]=s.split(&#x27;:&#x27;).map(Number);return h*3600+m*60;};
 const clock=t=&gt;[Math.floor(t/3600),Math.floor(t%3600/60),Math.floor(t%60)].map(n=&gt;String(n).padStart(2,&#x27;0&#x27;)).join(&#x27;:&#x27;);
 function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{page:ui.page,scenario:ui.scenario,market:ui.market,platform:ui.platform,widgetSize:ui.size,onboardingComplete:onboarding.complete,onboardingStep:onboarding.step},privateContent:{config,ui,onboarding}}).catch(()=&gt;{});}
 function restore(saved){
  const data=saved?.privateContent;
  if(!data)return;
  const restored={...defaults};
  for(const key of Object.keys(defaults)){
   const value=data.config?.[key];
   if(typeof defaults[key]===&#x27;number&#x27;&amp;&amp;Number.isFinite(value)&amp;&amp;value&gt;=0)restored[key]=value;
   if(typeof defaults[key]===&#x27;string&#x27;&amp;&amp;typeof value===&#x27;string&#x27;)restored[key]=value;
   if(key.endsWith(&#x27;Principal&#x27;)&amp;&amp;value===null)restored[key]=null;
  }
  if(restored.days&lt;1||restored.days&gt;30||!validSchedule(restored)||restored.mortgagePrincipal&gt;restored.mortgage||restored.carPrincipal&gt;restored.car||restored.stockPrev&lt;=0||restored.goldPrev&lt;=0)return;
  config=restored;
  const allowed={page:[&#x27;home&#x27;,&#x27;assets&#x27;,&#x27;loans&#x27;,&#x27;widgets&#x27;],scenario:[&#x27;work&#x27;,&#x27;off&#x27;,&#x27;weekend&#x27;],market:[&#x27;down&#x27;,&#x27;up&#x27;,&#x27;flat&#x27;],platform:[&#x27;android&#x27;,&#x27;ios&#x27;],size:[&#x27;small&#x27;,&#x27;medium&#x27;,&#x27;large&#x27;]};
  for(const [key,values]of Object.entries(allowed))if(values.includes(data.ui?.[key]))ui[key]=data.ui[key];
  ui.privacy=data.ui?.privacy===true;
  if(data.onboarding&amp;&amp;Number.isInteger(data.onboarding.step)&amp;&amp;data.onboarding.step&gt;=0&amp;&amp;data.onboarding.step&lt;=5){onboarding={...onboarding,...data.onboarding,draft:{...defaults,...data.onboarding.draft}};}
 }
 function validSchedule(c){
  const vals=[c.start,c.end,c.breakStart,c.breakEnd];

 }

  $(&#x27;mortgage-interest&#x27;).hidden=mode!==&#x27;mortgage&#x27;;
 }

  renderOnboarding();
 }
 function syncOnboardingFields(){
  $(&#x27;onboarding&#x27;).querySelectorAll(&#x27;input[name],select[name]&#x27;).forEach(input=&gt;{

  if(onboarding.step===5){
