  &lt;script type=&quot;application/json&quot; id=&quot;fm-timing-data&quot;&gt;
    {

      &quot;logicalSize&quot;: { &quot;width&quot;: 380, &quot;height&quot;: 238 },
      &quot;pat&quot;: {

        &quot;keyframesMs&quot;: [0, 120, 210, 410, 720, 1200, 2600, 3200],

      },
      &quot;departure&quot;: {

      },

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;fjob-motion-study&quot;);
      const el = (name) =&gt; root.querySelector(&quot;#fm-&quot; + name);
      const spec = JSON.parse(el(&quot;timing-data&quot;).textContent);
      const colors = {
        ink: &quot;#323a32&quot;,
        paper: &quot;#fffdf7&quot;,
        soft: &quot;#e9eddf&quot;,
        yellow: &quot;#f2dfac&quot;,
        rose: &quot;#f0d2c5&quot;,
        muted: &quot;#686e61&quot;,
        negative: &quot;#ad4736&quot;,
        positive: &quot;#46644e&quot;,
      };
      const osMotion = matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
      const state = {
        phase: &quot;working&quot;,
        mood: &quot;loss&quot;,
        tone: &quot;gentle&quot;,
        responseTone: &quot;gentle&quot;,
        showHousing: true,
        showCar: true,
        reduced: false,
        clip: &quot;pat&quot;,
        elapsed: 0,
        hasTimeline: false,
        playing: false,
        speed: 1,
        accepted: 0,
        responseIndex: 0,
        night: false,
      };
      let frameId = 0,
        previousTime = 0,
        drawnWidth = 0,
        drawnHeight = 0;
      const reduced = () =&gt; state.reduced || osMotion.matches;
      const clamp = (n, min = 0, max = 1) =&gt; Math.max(min, Math.min(max, n));
      const mix = (a, b, t) =&gt; a + (b - a) * t;
      const smooth = (t) =&gt; {
        const x = clamp(t);
        return x * x * (3 - 2 * x);
      };
      const segment = (t, a, b) =&gt; smooth((t - a) / (b - a));
      const duration = () =&gt;
        state.clip === &quot;pat&quot;
          ? reduced()
            ? 2400
            : 3200
          : state.clip === &quot;departure&quot;
            ? reduced()
              ? 0
              : 2200
            : reduced()
              ? 1500
              : 3700;
      const atDesk = (phase) =&gt; phase === &quot;working&quot; || phase === &quot;breakTime&quot;;
      const durationText = {
        pat: &quot;拍肩时间轴&quot;,
        departure: &quot;离场时间轴&quot;,
        race: &quot;中断与离场时间轴&quot;,
      };
      function view() {
        let phase = state.phase,
          kind = &quot;idle&quot;,
          local = 0;
        if (state.hasTimeline) {
          if (state.clip === &quot;race&quot;) {
            if (state.elapsed &lt; 1500) {
              kind = &quot;pat&quot;;
              phase = &quot;working&quot;;
              local = state.elapsed;
            } else {
              kind = &quot;departure&quot;;
              phase = &quot;afterShift&quot;;
              local = reduced() ? 2200 : state.elapsed - 1500;
            }
          } else {
            kind = state.clip;
            local = state.elapsed;
            if (kind === &quot;departure&quot;) {
              phase = &quot;afterShift&quot;;
              if (reduced()) local = 2200;
            }
          }
        }
        const pat = kind === &quot;pat&quot; &amp;&amp; local &lt; (reduced() ? 2400 : 3200);
        const departure = kind === &quot;departure&quot; &amp;&amp; local &lt; 2200;
        const presence = atDesk(phase) ? &quot;atDesk&quot; : &quot;emptyDesk&quot;;
        let relief = 0,
          compression = 0,
          handAlpha = 0;
        if (pat) {
          if (reduced()) relief = 1;
          else {
            relief =
              segment(local, 520, 900) * (1 - segment(local, 2400, 3200));
            compression =
              2.5 * Math.exp(-Math.pow((local - 210) / 53, 2)) +
              1.7 * Math.exp(-Math.pow((local - 410) / 53, 2));
            handAlpha = segment(local, 0, 120) * (1 - segment(local, 520, 720));
          }
        }
        const stand = kind === &quot;departure&quot; ? segment(local, 560, 860) : 0;
        const walk = kind === &quot;departure&quot; ? segment(local, 860, 1900) : 0;
        const actorVisible =
          presence === &quot;atDesk&quot; || (departure &amp;&amp; local &lt; 1900);
        return {
          phase,
          kind,
          local,
          pat,
          departure,
          presence,
          relief,
          compression,
          handAlpha,
          stand,
          walk,
          actorVisible,
          actorX: 181 + 239 * walk,
          canPat: presence === &quot;atDesk&quot; &amp;&amp; !pat &amp;&amp; !departure,
          complete: state.hasTimeline &amp;&amp; state.elapsed &gt;= duration(),
        };
      }
      function baseCaption(phase) {
        return {
          working: &quot;工位 0001 · 钱路过了你一下&quot;,
          breakTime: &quot;午休暂停计薪 · 肩膀也歇一歇&quot;,
          afterShift:
            state.showHousing || state.showCar
              ? &quot;人下班了，固定支出还在全勤。&quot;
              : &quot;人已下班，今天到此为止。&quot;,
          beforeShift: &quot;工位已就绪 · 人还没到岗&quot;,
          restDay: &quot;今日工位休息 · 人类模式已启动&quot;,
          unknown: &quot;排班待确认 · 先留一个空位&quot;,
        }[phase];
      }
      function response() {
        const work = state.phase !== &quot;breakTime&quot;;
        const gentle = work
          ? [
              &quot;辛苦了。你又不是打印机。&quot;,
              &quot;收到，肩膀先放下来一点。&quot;,
              &quot;谢谢，刚才差点卡成工位配件。&quot;,
            ]
          : [
              &quot;先歇会儿，下午再慢慢来。&quot;,
              &quot;这口气，总算顺下来了。&quot;,
              &quot;有人在意，午休都松一点。&quot;,
            ];
        const harsh = work
          ? [
              &quot;工资没加，倒是被当人看了一眼。&quot;,
              &quot;老板没看见，先松口气。&quot;,
              &quot;牛马收到一点人类关怀。&quot;,
            ]
          : [
              &quot;午休被记得，也算公司福利之外了。&quot;,
              &quot;人在充电，账单也在充电。&quot;,
              &quot;打工暂停，做人继续。&quot;,
            ];
        return (state.responseTone === &quot;gentle&quot; ? gentle : harsh)[
          state.responseIndex % 3
        ];
      }
      function phaseLabel(v) {
        if (v.pat)
          return reduced()
            ? &quot;低动效 · 静态抬眼回应&quot;
            : v.local &lt; 120
              ? &quot;响应 · 停手&quot;
              : v.local &lt; 300
                ? &quot;第一拍拍肩&quot;
                : v.local &lt; 520
                  ? &quot;第二拍拍肩&quot;
                  : v.local &lt; 900
                    ? &quot;抬眼 · 腮红 · 肩膀放松&quot;
                    : v.local &lt; 2400
                      ? &quot;保持回应&quot;
                      : &quot;恢复基础姿态&quot;;
        if (v.departure)
          return v.local &lt; 220
            ? &quot;停手 · 硬币收尾&quot;
            : v.local &lt; 560
              ? &quot;关掉显示器&quot;
              : v.local &lt; 860
                ? &quot;起身 · 提包&quot;
                : v.local &lt; 1900
                  ? &quot;前景行走 · 离开工位&quot;
                  : &quot;空椅子回正&quot;;
        if (v.kind === &quot;departure&quot;) return &quot;离场完成 · 空工位&quot;;
        return state.hasTimeline ? &quot;回应结束 · 基础姿态&quot; : &quot;等待播放&quot;;
      }
      function save() {
        if (window.openai?.setWidgetState)
          window.openai
            .setWidgetState({
              modelContent: {
                phase: state.phase,
                clip: state.clip,
                mood: state.mood,
                reducedMotion: reduced(),
              },
              privateContent: {
                phase: state.phase,
                mood: state.mood,
                tone: state.tone,
                showHousing: state.showHousing,
                showCar: state.showCar,
                reduced: state.reduced,
                speed: state.speed,
              },
            })
            .catch(() =&gt; {});
      }
      function announce(message) {
        el(&quot;status&quot;).textContent = message;
      }
      function stop() {
        cancelAnimationFrame(frameId);
        frameId = 0;
        previousTime = 0;
        state.playing = false;
      }
      function schedule() {
        if (state.playing &amp;&amp; !frameId) frameId = requestAnimationFrame(tick);
      }
      function startClip(clip, auto = true) {
        stop();
        state.clip = clip;
        state.hasTimeline = true;
        state.elapsed = 0;
        if (clip === &quot;departure&quot;) state.phase = &quot;afterShift&quot;;
        else if (clip === &quot;race&quot; || !atDesk(state.phase))
          state.phase = &quot;working&quot;;
        if (clip !== &quot;departure&quot;) {
          state.responseTone = state.tone;
          state.responseIndex = state.accepted % 3;
          state.accepted++;
        }
        state.playing = auto &amp;&amp; duration() &gt; 0;
        if (duration() === 0) state.elapsed = 0;
        render(true);
        schedule();
        save();
      }
      function requestPat() {
        const v = view();
        if (!v.canPat) return false;
        startClip(&quot;pat&quot;);
        announce(response());
        return true;
      }
      function seek(ms) {
        stop();
        state.hasTimeline = true;
        state.elapsed = clamp(Number(ms) || 0, 0, duration());
        render();
      }
      function setPhase(phase) {
        stop();
        state.phase = phase;
        state.night = false;
        state.hasTimeline = false;
        state.elapsed = 0;
        render(true);
        save();
      }
      function markers() {
        const total = duration();
        return [
          ...new Set(
            spec[state.clip].keyframesMs
              .filter((n) =&gt; n &lt;= total)
              .concat(total),
          ),
        ];
      }
      function syncMarkers() {
        el(&quot;markers&quot;).replaceChildren(
          ...markers().map((ms) =&gt; {
            const button = document.createElement(&quot;button&quot;);
            button.type = &quot;button&quot;;
            button.textContent = ms + &quot;ms&quot;;
            button.dataset.ms = ms;
            button.addEventListener(&quot;click&quot;, () =&gt; seek(ms));
            return button;
          }),
        );
      }
      function render(rebuild = false) {
        const v = view();
        const amount = root.querySelector(&quot;.amount&quot;);
        amount.textContent =
          state.mood === &quot;gain&quot;
            ? &quot;+¥245.23&quot;
            : state.mood === &quot;unknown&quot;
              ? &quot;¥194.74&quot;
              : &quot;−¥55.26&quot;;
        amount.style.color =
          state.mood === &quot;gain&quot;
            ? colors.positive
            : state.mood === &quot;unknown&quot;
              ? colors.muted
              : colors.negative;
        root.querySelector(&quot;.quote&quot;).textContent =
          state.mood === &quot;gain&quot;
            ? &quot;今天暂时领先，先小声开心一下。&quot;
            : state.mood === &quot;unknown&quot;
              ? &quot;投资待更新，当前合计不完整。&quot;
              : &quot;工资正在努力追赶上午的亏损。&quot;;
        el(&quot;investment&quot;).textContent =
          state.mood === &quot;gain&quot;
            ? &quot;+¥50.49&quot;
            : state.mood === &quot;unknown&quot;
              ? &quot;待更新&quot;
              : &quot;−¥250.00&quot;;
        el(&quot;phase&quot;).value = state.phase;
        el(&quot;mood&quot;).value = state.mood;
        el(&quot;tone&quot;).value = state.tone;
        el(&quot;clip&quot;).value = state.clip;
        el(&quot;speed&quot;).value = String(state.speed);
        el(&quot;house&quot;).checked = state.showHousing;
        el(&quot;car&quot;).checked = state.showCar;
        el(&quot;reduced&quot;).checked = reduced();
        el(&quot;reduced&quot;).disabled = osMotion.matches;
        const disabledLabel = {
          afterShift: &quot;他已下班&quot;,
          beforeShift: &quot;还没到工位&quot;,
          restDay: &quot;今天不在岗&quot;,
          unknown: &quot;排班待确认&quot;,
        }[v.phase];
        el(&quot;pat&quot;).disabled = !v.canPat;
        el(&quot;head&quot;).disabled = !v.canPat;
        el(&quot;pat&quot;).textContent = v.pat
          ? v.local &lt; 520
            ? &quot;收到啦&quot;
            : &quot;他缓过来一点了&quot;
          : disabledLabel || &quot;拍拍他&quot;;
        el(&quot;stamp&quot;).textContent = {
          working: &quot;在岗求生中&quot;,
          breakTime: &quot;午休歇一歇&quot;,
          afterShift: &quot;他已下班&quot;,
          beforeShift: &quot;还没到岗&quot;,
          restDay: &quot;今日休息&quot;,
          unknown: &quot;排班待确认&quot;,
        }[v.phase];
        el(&quot;clock&quot;).textContent =
          &quot;星期三 · &quot; +
          (state.night
            ? v.phase === &quot;afterShift&quot;
              ? &quot;02:00&quot;
              : &quot;00:00&quot;
            : v.phase === &quot;afterShift&quot;
              ? &quot;18:00&quot;
              : v.phase === &quot;breakTime&quot;
                ? &quot;12:30&quot;
                : &quot;14:36&quot;);
        el(&quot;countdown&quot;).textContent =
          v.phase === &quot;working&quot;
            ? state.night
              ? &quot;距离下班还有 02:00:00&quot;
              : &quot;距离下班还有 03:24:00&quot;
            : v.phase === &quot;breakTime&quot;
              ? &quot;午休中 · 账单继续分摊&quot;
              : v.phase === &quot;afterShift&quot;
                ? &quot;今日班次已结束&quot;
                : &quot;工位暂时无人&quot;;
        el(&quot;work-progress&quot;).style.width =
          v.phase === &quot;afterShift&quot;
            ? &quot;100%&quot;
            : v.phase === &quot;restDay&quot; ||
                v.phase === &quot;beforeShift&quot; ||
                v.phase === &quot;unknown&quot;
              ? &quot;0%&quot;
              : &quot;58%&quot;;
