  <script type="application/json" id="fm-timing-data">
    {
      "version": "1.0",
      "logicalSize": { "width": 380, "height": 238 },
      "pat": {
        "durationMs": 3200,
        "reducedDurationMs": 2400,
        "contactsMs": [210, 410],
        "keyframesMs": [0, 120, 210, 410, 720, 1200, 2600, 3200],
        "responseAtMs": 420,
        "reliefStartMs": 520,
        "reliefFullMs": 900,
        "reliefEndMs": 2400,
        "handEndMs": 720
      },
      "departure": {
        "durationMs": 2200,
        "keyframesMs": [0, 220, 560, 860, 1400, 1900, 2200],
        "stopCoinsMs": 180,
        "standStartMs": 560,
        "walkStartMs": 860,
        "walkEndMs": 1900,
        "exitX": 420
      },
      "race": {
        "boundaryMs": 1500,
        "durationMs": 3700,
        "keyframesMs": [0, 210, 720, 1490, 1500, 2060, 2360, 2900, 3400, 3700]
      },
      "headHitRect": { "x": 138, "y": 44, "width": 83, "height": 125 }
    }
  </script>
  <script>
    (() => {
      const root = document.getElementById("fjob-motion-study");
      const el = (name) => root.querySelector("#fm-" + name);
      const spec = JSON.parse(el("timing-data").textContent);
      const colors = {
        ink: "#323a32",
        paper: "#fffdf7",
        soft: "#e9eddf",
        yellow: "#f2dfac",
        rose: "#f0d2c5",
        muted: "#686e61",
        negative: "#ad4736",
        positive: "#46644e",
      };
      const osMotion = matchMedia("(prefers-reduced-motion: reduce)");
      const state = {
        phase: "working",
        mood: "loss",
        tone: "gentle",
        responseTone: "gentle",
        showHousing: true,
        showCar: true,
        reduced: false,
        clip: "pat",
        elapsed: 0,
        hasTimeline: false,
        playing: false,
        speed: 1,
        accepted: 0,
        responseIndex: 0,
        night: false,
      };
      let frameId = 0,
        previousTime = 0,
        drawnWidth = 0,
        drawnHeight = 0;
      const reduced = () => state.reduced || osMotion.matches;
      const clamp = (n, min = 0, max = 1) => Math.max(min, Math.min(max, n));
      const mix = (a, b, t) => a + (b - a) * t;
      const smooth = (t) => {
        const x = clamp(t);
        return x * x * (3 - 2 * x);
      };
      const segment = (t, a, b) => smooth((t - a) / (b - a));
      const duration = () =>
        state.clip === "pat"
          ? reduced()
            ? 2400
            : 3200
          : state.clip === "departure"
            ? reduced()
              ? 0
              : 2200
            : reduced()
              ? 1500
              : 3700;
      const atDesk = (phase) => phase === "working" || phase === "breakTime";
      const durationText = {
        pat: "拍肩时间轴",
        departure: "离场时间轴",
        race: "中断与离场时间轴",
      };
      function view() {
        let phase = state.phase,
          kind = "idle",
          local = 0;
        if (state.hasTimeline) {
          if (state.clip === "race") {
            if (state.elapsed < 1500) {
              kind = "pat";
              phase = "working";
              local = state.elapsed;
            } else {
              kind = "departure";
              phase = "afterShift";
              local = reduced() ? 2200 : state.elapsed - 1500;
            }
          } else {
            kind = state.clip;
            local = state.elapsed;
            if (kind === "departure") {
              phase = "afterShift";
              if (reduced()) local = 2200;
            }
          }
        }
        const pat = kind === "pat" && local < (reduced() ? 2400 : 3200);
        const departure = kind === "departure" && local < 2200;
        const presence = atDesk(phase) ? "atDesk" : "emptyDesk";
        let relief = 0,
          compression = 0,
          handAlpha = 0;
        if (pat) {
          if (reduced()) relief = 1;
          else {
            relief =
              segment(local, 520, 900) * (1 - segment(local, 2400, 3200));
            compression =
              2.5 * Math.exp(-Math.pow((local - 210) / 53, 2)) +
              1.7 * Math.exp(-Math.pow((local - 410) / 53, 2));
            handAlpha = segment(local, 0, 120) * (1 - segment(local, 520, 720));
          }
        }
        const stand = kind === "departure" ? segment(local, 560, 860) : 0;
        const walk = kind === "departure" ? segment(local, 860, 1900) : 0;
        const actorVisible =
          presence === "atDesk" || (departure && local < 1900);
        return {
          phase,
          kind,
          local,
          pat,
          departure,
          presence,
          relief,
          compression,
          handAlpha,
          stand,
          walk,
          actorVisible,
          actorX: 181 + 239 * walk,
          canPat: presence === "atDesk" && !pat && !departure,
          complete: state.hasTimeline && state.elapsed >= duration(),
        };
      }
      function baseCaption(phase) {
        return {
          working: "工位 0001 · 钱路过了你一下",
          breakTime: "午休暂停计薪 · 肩膀也歇一歇",
          afterShift:
            state.showHousing || state.showCar
              ? "人下班了，固定支出还在全勤。"
              : "人已下班，今天到此为止。",
          beforeShift: "工位已就绪 · 人还没到岗",
          restDay: "今日工位休息 · 人类模式已启动",
          unknown: "排班待确认 · 先留一个空位",
        }[phase];
      }
      function response() {
        const work = state.phase !== "breakTime";
        const gentle = work
          ? [
              "辛苦了。你又不是打印机。",
              "收到，肩膀先放下来一点。",
              "谢谢，刚才差点卡成工位配件。",
            ]
          : [
              "先歇会儿，下午再慢慢来。",
              "这口气，总算顺下来了。",
              "有人在意，午休都松一点。",
            ];
        const harsh = work
          ? [
              "工资没加，倒是被当人看了一眼。",
              "老板没看见，先松口气。",
              "牛马收到一点人类关怀。",
            ]
          : [
              "午休被记得，也算公司福利之外了。",
              "人在充电，账单也在充电。",
              "打工暂停，做人继续。",
            ];
        return (state.responseTone === "gentle" ? gentle : harsh)[
          state.responseIndex % 3
        ];
      }
      function phaseLabel(v) {
        if (v.pat)
          return reduced()
            ? "低动效 · 静态抬眼回应"
            : v.local < 120
              ? "响应 · 停手"
              : v.local < 300
                ? "第一拍拍肩"
                : v.local < 520

        if (v.actorVisible && !v.departure) {
          line(
            [
              [124, 140],
              [122, 134],
              [125, 128],
            ],
            p.muted,
            1,
          );
          line(
            [
              [131, 140],
              [133, 135],
              [131, 130],
            ],
            p.muted,
            1,
          );
        }
        if (walking) person();
        const coins =
          (v.phase === "working" || (v.departure && v.local < 180)) &&
          (state.showHousing || state.showCar);
        if (coins) {
          const destinations = [];
          if (state.showHousing) destinations.push([45, 149]);
          if (state.showCar) destinations.push([342, 192]);
          for (let i = 0; i < 4; i++) {
            const a =
              ((state.playing && !reduced() ? state.elapsed * 0.00014 : 0) +
                i / 4) %
              1;
            const target = destinations[i % destinations.length];
            const x = mix(210, target[0], a),
              y = mix(153, target[1], a) - Math.sin(a * Math.PI) * 38;
            ctx.globalAlpha = v.departure ? 1 - v.local / 180 : 1;
            oval(x, y, 6, 7, p.yellow);
            text("¥", x - 3, y + 3, 9);
            ctx.globalAlpha = 1;
          }
        }
        if (v.handAlpha > 0) {
          ctx.save();
          ctx.globalAlpha = v.handAlpha;
          const enter = segment(v.local, 0, 160),
            leave = segment(v.local, 520, 720);
          const x = mix(235, 210, enter) + 25 * leave,
            y = mix(106, 132, enter) - 26 * leave + v.compression;
          ctx.translate(x, y);
          ctx.rotate(-0.35);
          ctx.beginPath();
          ctx.moveTo(-9, 10);
          ctx.lineTo(-11, -1);
          ctx.quadraticCurveTo(-12, -5, -8, -5);
          ctx.lineTo(-4, 0);
          ctx.lineTo(-5, -13);
          ctx.quadraticCurveTo(-5, -17, -1, -16);
          ctx.lineTo(1, -4);
          ctx.lineTo(2, -16);
          ctx.quadraticCurveTo(3, -20, 6, -17);
          ctx.lineTo(8, -5);
          ctx.lineTo(9, -13);
          ctx.quadraticCurveTo(11, -16, 13, -12);
          ctx.lineTo(15, 4);
          ctx.quadraticCurveTo(13, 13, 5, 15);
          ctx.lineTo(-1, 17);
          ctx.closePath();
          ctx.fillStyle = p.paper;
          ctx.fill();
          ctx.lineWidth = 1.8;
          ctx.strokeStyle = p.ink;
          ctx.stroke();
          ctx.restore();
          if (v.compression > 1) {
            line(
              [
                [210, 132],
                [215, 128],
              ],
              p.muted,
              1.5,
            );
            line(
              [
                [211, 140],
                [217, 140],
              ],
              p.muted,
              1.5,
            );
          }
        }
        const footer = v.departure
          ? "工位正在交还给空气"
          : v.phase === "working"
            ? "收入运输中…"
            : v.phase === "breakTime"
              ? "午休暂停计薪"
              : v.phase === "afterShift"
                ? "今日工位，暂停营业。"
                : "今天工位休息";
        text(footer, 132, 235, 11, p.muted);
      }
      el("pat").addEventListener("click", requestPat);
      el("head").addEventListener("click", requestPat);
      el("play-pat").addEventListener("click", () => {
        startClip("pat");
        announce("拍肩片段开始。");
      });
      el("play-exit").addEventListener("click", () => {
        startClip("departure");
        announce("下班了，他开始收拾东西。");
      });
      el("race").addEventListener("click", () => {
        state.phase = "working";
        startClip("race");
        announce("演示拍肩进行到1500ms时下班。");
      });
      el("phase").addEventListener("change", (event) =>
        setPhase(event.target.value),
      );
      for (const name of ["mood", "tone"])
        el(name).addEventListener("change", (event) => {
          state[name] = event.target.value;
          render();
          save();
        });
      for (const [id, key] of [
        ["house", "showHousing"],
        ["car", "showCar"],
      ])
        el(id).addEventListener("change", (event) => {
          state[key] = event.target.checked;
          render();
          save();
        });
      function motionChanged() {
        const wasComplete = state.hasTimeline && state.elapsed >= duration();
        state.reduced = el("reduced").checked;
        if (wasComplete || (state.hasTimeline && state.elapsed >= duration())) {
          stop();
          state.elapsed = duration();
        }
        render(true);
        save();
      }
      el("reduced").addEventListener("change", motionChanged);
      osMotion.addEventListener("change", () => {
        if (state.hasTimeline && state.elapsed >= duration()) {
          stop();
          state.elapsed = duration();
        }
        render(true);
      });
      el("clip").addEventListener("change", (event) =>
        startClip(event.target.value, false),
      );
      el("speed").addEventListener("change", (event) => {
        state.speed = Number(event.target.value);
        save();
      });
      el("seek").addEventListener("input", (event) => seek(event.target.value));
      el("prev").addEventListener("click", () => seek(state.elapsed - 100));
      el("next").addEventListener("click", () => seek(state.elapsed + 100));
      el("toggle").addEventListener("click", () => {
        if (state.playing) {
          stop();
          render();
          return;
        }
        if (!state.hasTimeline || state.elapsed >= duration()) {
          startClip(state.clip);
          return;
        }
        state.playing = true;
        previousTime = 0;
        render();
        schedule();
      });
      el("midnight").addEventListener("click", () => {
        setPhase("working");
        state.night = true;
        render();
        announce("夜班22:00—02:00，午夜仍然在岗。");
      });
      el("night-exit").addEventListener("click", () => {
        state.night = true;
        startClip("departure");
        announce("夜班在02:00结束，开始离场。");
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          const phase = view().phase;
          stop();
          state.phase = phase;
          state.hasTimeline = false;
          state.elapsed = 0;
          render();
        }
      });
      const resize = new ResizeObserver(() => render());
      resize.observe(root);
      function restore(saved) {
        const data = saved?.privateContent;
        if (!data) return;
        const options = {
          phase: [
            "working",
            "breakTime",
            "afterShift",
            "beforeShift",
            "restDay",
            "unknown",
          ],
          mood: ["gain", "loss", "unknown"],
          tone: ["gentle", "harsh"],
        };
        for (const [key, allowed] of Object.entries(options))
          if (allowed.includes(data[key])) state[key] = data[key];
        for (const key of ["showHousing", "showCar", "reduced"])
          if (typeof data[key] === "boolean") state[key] = data[key];
        if ([0.5, 1].includes(data.speed)) state.speed = data.speed;
      }
      restore(window.openai?.widgetState);
      window.addEventListener("openai:set_globals", (event) => {
        if (event.detail?.globals?.widgetState) {
          restore(event.detail.globals.widgetState);
          render(true);
        }
      });
      window.fjobAnimationPrototype = {
        playPat: requestPat,
        playDeparture: () => startClip("departure"),
        playRace: () => startClip("race"),
        pause: () => {
          stop();
          render();
        },
        seek,
        selectClip: (clip) => {
          if (["pat", "departure", "race"].includes(clip))
            startClip(clip, false);
        },
        setPhase: (phase) => {
          if (
            [
              "working",
              "breakTime",
              "afterShift",
              "beforeShift",
              "restDay",
              "unknown",
            ].includes(phase)
          )
            setPhase(phase);
        },
        inspect: () => ({
          ...state,
          ...view(),
          duration: duration(),
          specVersion: spec.version,
        }),
      };
      render(true);
    })();
  </script>
</div>
